<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Camisetas - PowerClip Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #f4f4f9; }
    
    /* Painel Lateral de Controle */
    .controls { width: 320px; padding: 20px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; gap: 15px; }
    .controls h2 { font-size: 1.2rem; margin-bottom: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-weight: bold; font-size: 0.9rem; }
    input[type="color"], input[type="file"] { width: 100%; padding: 5px; cursor: pointer; }
    
    /* Áreas do Simulador */
    .stage { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
    .mockup-container { width: 500px; height: 500px; position: relative; }
    
    /* SVG Overlay para o Efeito PowerClip */
    svg.simulator-canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    /* Camada de Sombras/Dobras (Sombra sobreposta com Multiply) */
    .shadow-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: multiply; /* Faz as dobras e sombras reagirem à cor/estampa */
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- CONTROLES -->
  <div class="controls">
    <h2>Personalizador</h2>
    
    <div class="control-group">
      <label for="bgColor">Cor da Camiseta:</label>
      <input type="color" id="bgColor" value="#ffffff">
    </div>

    <div class="control-group">
      <label for="patternInput">Upload de Estampa (Template):</label>
      <input type="file" id="patternInput" accept="image/*">
    </div>
  </div>

  <!-- PALCO DO SIMULADOR -->
  <div class="stage">
    <div class="mockup-container">
      
      <!-- SVG que aplica o PowerClip (ClipPath) -->
      <svg class="simulator-canvas" viewBox="0 0 1000 1000">
        <defs>
          <!-- Definição da Máscara do Silhueta (Ajustar o Path com as coordenadas da sua imagem) -->
          <clipPath id="tshirt-clip">
            <!-- Exemplo de contorno vetorial da camiseta -->
            <path d="M 300,150 L 400,220 L 600,220 L 700,150 L 850,280 L 750,420 L 700,370 L 700,880 A 20,20 0 0,1 680,900 L 320,900 A 20,20 0 0,1 300,880 L 300,370 L 250,420 L 150,280 Z" />
          </clipPath>

          <!-- Pattern Dinâmico para carregar a estampa retangular sem esticar incorretamente -->
          <pattern id="user-pattern" patternUnits="userSpaceOnUse" width="1000" height="1000">
            <image id="pattern-image" href="" width="1000" height="1000" preserveAspectRatio="xMidYMid slice" />
          </pattern>
        </defs>

        <!-- Cor de Fundo recortada pela camiseta -->
        <rect id="tshirt-base-color" width="100%" height="100%" fill="#ffffff" clip-path="url(#tshirt-clip)" />

        <!-- Estampa Aplicada via PowerClip -->
        <rect id="tshirt-pattern-layer" width="100%" height="100%" fill="url(#user-pattern)" clip-path="url(#tshirt-clip)" opacity="0" />
      </svg>

      <!-- Imagem de Sombras Realistas (Utilizando o PNG enviado) -->
      <img src="FRENTE.png" class="shadow-overlay" alt="Sombras da Camiseta">
    </div>
  </div>

  <!-- LÓGICA DE TROCA DE COR E TEMPLATE -->
  <script>
    const colorPicker = document.getElementById('bgColor');
    const baseColorRect = document.getElementById('tshirt-base-color');
    const patternInput = document.getElementById('patternInput');
    const patternImage = document.getElementById('pattern-image');
    const patternLayer = document.getElementById('tshirt-pattern-layer');

    // Mudar a cor de fundo mantendo o PowerClip
    colorPicker.addEventListener('input', (e) => {
      baseColorRect.setAttribute('fill', e.target.value);
    });

    // Inserir imagem/template como PowerClip dentro do contorno
    patternInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          patternImage.setAttribute('href', event.target.result);
          patternLayer.setAttribute('opacity', '1'); // Exibe a estampa
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
