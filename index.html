<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  .mockup-container {
    position: relative;
    width: 400px;
    height: 400px;
  }

  /* 1. Camada da cor/estampa base (só no corpo da camisa) */
  .shirt-color {
    position: absolute;
    width: 100%;
    height: 100%;
    background-color: #d31329; /* Altere a cor aqui */
  }

  /* 2. Camada da estampa/arte */
  .shirt-print {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    z-index: 2;
  }

  /* 3. Camada do Efeito de Sombra e Dobras Reais */
  .shirt-shadow-texture {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Imagem da textura de sombras extraída em tons de cinza */
    background-image: url('sombra-e-dobras-camisa.png');
    background-size: contain;
    background-repeat: no-repeat;
    mix-blend-mode: multiply; /* Aplica o sombreamento sem alterar golas/detalhes */
    pointer-events: none;
    z-index: 3;
  }

  /* 4. Camada de detalhes fixos (Golas e Punhos brancos originais) */
  .shirt-details-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('golas-e-punhos.png');
    background-size: contain;
    background-repeat: no-repeat;
    z-index: 4;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="mockup-container">
  <!-- Cor de fundo alterável -->
  <div class="shirt-color"></div>

  <!-- Sua arte no peito -->
  <img src="sua-arte.png" alt="Arte" class="shirt-print">

  <!-- Efeito de sombra/dobras exato -->
  <div class="shirt-shadow-texture"></div>

  <!-- Mantém a gola e os punhos intactos -->
  <div class="shirt-details-overlay"></div>
</div>

</body>
</html>
