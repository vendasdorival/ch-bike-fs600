<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Uniforme - Kattálogo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f5f7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    /* Container do Mockup na Proporção Exata (600x650) */
    .mockup-canvas {
      position: relative;
      width: 600px;
      height: 650px;
      background-color: transparent;
      overflow: hidden;
    }

    /* Regra Base para Todas as Camadas de Objetos */
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      transition: background-color 0.2s ease;
    }

    /* 0. Sombra Interna do Pescoço (Atrás de tudo) */
    .layer-neck-bg {
      background-image: url('FUNDO_PESCOCO.png');
      z-index: 0;
    }

    /* 1. Objeto Tronco/Corpo */
    .layer-body {
      background-image: url('CORPO_BASE.png');
      background-color: #ffffff;
      z-index: 1;
    }

    /* 2. Objeto Mangas (Esquerda + Direita isoladas) */
    .layer-sleeves {
      background-image: url('MANGAS.png');
      background-color: #ff6b00; /* Cor inicial (Laranja) */
      z-index: 2;
    }

    /* 3. Objeto Gola (Sobrepõe o corpo e as mangas no topo) */
    .layer-collar {
      background-image: url('GOLA_REDONDA.png');
      background-color: #ffffff;
      z-index: 3;
    }

    /* 4. Camada de Sombra 3D e Vincos (Multiplicação de Textura) */
    .layer-overlay {
      background-image: url('TEXTURA_E_SOMBRAS.png');
      mix-blend-mode: multiply;
      opacity: 0.65;
      pointer-events: none;
      z-index: 4;
    }

    /* Painel de Seleção de Cores e Tipos */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      background: #f9fafb;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .control-group label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-group input[type="color"] {
      -webkit-appearance: none;
      border: 2px solid #e5e7eb;
      width: 48px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    .control-group input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    .control-group input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .control-group select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background-color: #ffffff;
      font-size: 14px;
      color: #1f2937;
      outline: none;
      cursor: pointer;
    }

    .control-group select:focus {
      border-color: #ff6b00;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ÁREA DO MOCKUP -->
    <div class="mockup-canvas">
      <div class="layer layer-neck-bg"></div>
      <div id="shirt-body" class="layer layer-body"></div>
      <div id="shirt-sleeves" class="layer layer-sleeves"></div>
      <div id="shirt-collar" class="layer layer-collar"></div>
      <div class="layer layer-overlay"></div>
    </div>

    <!-- PAINEL DE CONTROLES -->
    <div class="controls">
      <!-- Troca do Modelo de Gola -->
      <div class="control-group">
        <label for="collar-type">Modelo da Gola</label>
        <select id="collar-type" onchange="changeCollarType(this.value)">
          <option value="GOLA_REDONDA.png">Gola Redonda</option>
          <option value="GOLA_V.png">Gola V</option>
          <option value="GOLA_MADRID.png">Gola Madrid</option>
        </select>
      </div>

      <!-- Cor do Corpo -->
      <div class="control-group">
        <label for="color-body">Cor do Corpo</label>
        <input type="color" id="color-body" value="#ffffff" onchange="updateColor('shirt-body', this.value)">
      </div>

      <!-- Cor das Mangas -->
      <div class="control-group">
        <label for="color-sleeves">Cor das Mangas</label>
        <input type="color" id="color-sleeves" value="#ff6b00" onchange="updateColor('shirt-sleeves', this.value)">
      </div>

      <!-- Cor da Gola -->
      <div class="control-group">
        <label for="color-collar">Cor da Gola</label>
        <input type="color" id="color-collar" value="#ffffff" onchange="updateColor('shirt-collar', this.value)">
      </div>
    </div>
  </div>

  <script>
    // Função para atualizar as cores das peças individuais
    function updateColor(layerId, colorValue) {
      document.getElementById(layerId).style.backgroundColor = colorValue;
    }

    // Função para alterar a imagem do objeto Gola (Redonda, V, Madrid)
    function changeCollarType(imageName) {
      const collarElement = document.getElementById('shirt-collar');
      collarElement.style.backgroundImage = `url('${imageName}')`;
    }
  </script>

</body>
</html>
